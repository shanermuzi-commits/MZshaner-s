<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
<title>制品叠加计价器 (云同步版)</title>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
/* ===== 基础 ===== */
*{margin:0;padding:0;box-sizing:border-box;}
html,body{height:100%;background:#f4f6f8;font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#1e1e1e;overflow:hidden;transition:background .25s,color .25s;}
body{display:flex;align-items:center;justify-content:center;}
.app-container{width:100%;max-width:1600px;height:100vh;background:#fff;display:flex;flex-direction:column;overflow:hidden;position:relative;transition:background .25s;}

/* 装饰色块 */
.app-container::before{content:'';position:absolute;top:-120px;right:-120px;width:400px;height:400px;background:radial-gradient(circle,rgba(200,210,220,.15) 0%,rgba(200,210,220,0) 70%);border-radius:50%;pointer-events:none;z-index:0;}
.app-container::after{content:'';position:absolute;bottom:-80px;left:-80px;width:300px;height:300px;background:radial-gradient(circle,rgba(220,230,240,.12) 0%,rgba(220,230,240,0) 70%);border-radius:50%;pointer-events:none;z-index:0;}

/* ===== 深色模式 ===== */
body.dark{background:#1a1a1a;}
body.dark .app-container{background:#1e1e1e;}
body.dark .app-container::before,body.dark .app-container::after{opacity:.2;}
body.dark .settings-panel,body.dark .product-card,body.dark .lib-card,body.dark .total-area,body.dark .dynamic-spec,body.dark .extra-item,body.dark .modal-box,body.dark .preview-image-section{background:#2a2a2a!important;border-color:#444!important;}
body.dark .preview-panel{background:#fff!important;border-color:#e5e9ec!important;}
body.dark .preview-panel .preview-title{background:#f8fafc!important;border-color:#edf0f2!important;color:#1a1a1a!important;}
body.dark .preview-panel .preview-item{border-color:#edf0f2!important;color:#1a1a1a!important;}
body.dark .preview-panel .preview-row{color:#1a1a1a!important;}
body.dark .preview-panel .preview-total{border-color:#d1d6dc!important;color:#1a1a1a!important;}
body.dark .preview-panel .preview-divider{border-color:#e5e9ec!important;}
body.dark .preview-panel .preview-footer{color:#b0b8c0!important;border-color:#e5e9ec!important;}
body.dark .preview-panel .preview-empty{color:#b0b8c0!important;}
body.dark .preview-panel .preview-time{color:#8a8f99!important;}
body.dark .receipt-container{background:#fff!important;color:#1a1a1a!important;}
body.dark .receipt-container *{color:inherit;}
body.dark .section-header{border-color:#444!important;}
body.dark .section-header h3{color:#e0e0e0!important;}
body.dark .global-title,body.dark .lib-card .lib-title{background:#333!important;border-color:#444!important;color:#e0e0e0!important;}
body.dark .global-row label,body.dark .select-field label,body.dark .qty-field label,body.dark .dynamic-spec label,body.dark .inline-note,body.dark .preview-image-section span,body.dark .preview-image-section label,body.dark .global-row label[for="depositCheck"]{color:#aaa!important;}
body.dark input,body.dark select,body.dark textarea{background:#333!important;border-color:#555!important;color:#e0e0e0!important;}
body.dark select option{background:#333!important;color:#e0e0e0!important;}
body.dark .btn-secondary,body.dark .btn-secondary-light,body.dark .lib-add-row .btn-sm,body.dark .btn-back,body.dark .btn-manage,body.dark .data-actions .btn-sm{background:#333!important;border-color:#555!important;color:#e0e0e0!important;}
body.dark .btn-secondary:hover,body.dark .btn-secondary-light:hover,body.dark .lib-add-row .btn-sm:hover,body.dark .btn-back:hover,body.dark .btn-manage:hover,body.dark .data-actions .btn-sm:hover{background:#444!important;}
body.dark .btn-primary,body.dark .btn-dark,body.dark .btn-add-circle{background:#555!important;border-color:#555!important;color:#fff!important;}
body.dark .btn-primary:hover,body.dark .btn-dark:hover,body.dark .btn-add-circle:hover{background:#666!important;}
body.dark .product-card::before{background:linear-gradient(90deg,#555,#666);}
body.dark .card-index{background:#444;color:#aaa;}
body.dark .item-subtotal{background:#333;border-color:#555;color:#e0e0e0!important;}
body.dark .lib-item{border-color:#444;}
body.dark .lib-item.lib-active{background:#444;}
body.dark .lib-item .lib-label{color:#e0e0e0!important;}
body.dark .lib-item .lib-label .sub{color:#888!important;}
body.dark .lib-item .lib-price{color:#aaa!important;}
body.dark .delete-item,body.dark .del-btn{color:#999!important;}
body.dark .delete-item:hover,body.dark .del-btn:hover{color:#e06b6b!important;}
body.dark .extra-item{background:#333;border-color:#555;color:#e0e0e0!important;}
body.dark .extra-item input[type=number]{background:#333!important;border-color:#555!important;color:#e0e0e0!important;}
body.dark .dynamic-spec{background:#333;border-color:#555;}
body.dark .total-area{background:#333;border-color:#555;}
body.dark .total-area .label{color:#aaa!important;}
body.dark .total-area .total-number{color:#fff!important;}
body.dark .modal-overlay{background:rgba(0,0,0,.7);}
body.dark .modal-box h3{color:#e0e0e0!important;}
body.dark .modal-box p{color:#aaa!important;}
body.dark .modal-box label{color:#aaa!important;}
body.dark .content-area::-webkit-scrollbar-thumb{background:#555;}
body.dark .content-area::-webkit-scrollbar-track{background:#333;}
body.dark input[type=date]::-webkit-calendar-picker-indicator{filter:invert(1) brightness(1.5);}

/* ===== 主题切换 & 云同步状态 ===== */
.top-controls {position:absolute; top:12px; right:16px; z-index:50; display:flex; align-items:center; gap:10px;}
.cloud-status {font-size:0.7rem; display:flex; align-items:center; gap:4px; color:#6b7280; background:rgba(255,255,255,.9); backdrop-filter:blur(8px); padding:4px 8px; border-radius:20px; border:1px solid #edf0f2; box-shadow:0 2px 8px rgba(0,0,0,.04); transition:.2s;}
.cloud-status.syncing {color:#d97706;}
.cloud-status.synced {color:#10b981;}
.cloud-status.error {color:#ef4444;}
.cloud-dot {width:6px; height:6px; border-radius:50%; background:currentColor;}
.theme-toggle{background:rgba(255,255,255,.9);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid #edf0f2;cursor:pointer;padding:.25rem;color:#6b7280;transition:.15s;border-radius:50%;display:flex;align-items:center;justify-content:center;width:36px;height:36px;box-shadow:0 2px 8px rgba(0,0,0,.04);}
.theme-toggle:hover{color:#1a1a1a;background:#f1f4f6;}
.theme-toggle svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
.theme-toggle .icon-sun{display:block;}
.theme-toggle .icon-moon{display:none;}
body.dark .theme-toggle{background:rgba(42,42,42,.9);border-color:#444;color:#aaa;}
body.dark .theme-toggle:hover{background:#333;color:#fff;}
body.dark .theme-toggle .icon-sun{display:none;}
body.dark .theme-toggle .icon-moon{display:block;}
body.dark .cloud-status {background:rgba(42,42,42,.9); border-color:#444;}

/* ===== 内容区 ===== */
.content-area{flex:1;overflow-y:auto;padding:3.5rem 1.4rem 1.4rem;position:relative;z-index:1;-webkit-overflow-scrolling:touch;}
.content-area::-webkit-scrollbar{width:6px;}
.content-area::-webkit-scrollbar-thumb{background:#d1d6dc;border-radius:6px;}
.content-area::-webkit-scrollbar-track{background:#f1f4f6;}
.view-pricing,.view-library{display:block;}
.view-library{display:none;}
.show-library .view-pricing{display:none;}
.show-library .view-library{display:block;}

/* ===== 三栏布局 ===== */
.layout-three{display:flex;flex-wrap:wrap;gap:1.4rem;}
.layout-three .col-cart{flex:2.4;min-width:280px;}
.layout-three .col-settings{flex:1.2;min-width:230px;}
.layout-three .col-preview{flex:1.5;min-width:260px;}

/* ===== 通用 ===== */
.section-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem;padding-bottom:.5rem;border-bottom:1px solid #edf0f2;flex-wrap:wrap;gap:.5rem;}
.section-header h3{font-weight:550;font-size:.88rem;color:#1a1a1a;letter-spacing:-.2px;}
.section-header .hdr-actions{display:flex;gap:.5rem;align-items:center;}

.col-cart .section-header {
    position: sticky;
    top: -3.5rem; 
    z-index: 50;
    background: #fff;
    padding-top: 3.5rem; 
    margin-top: -3.5rem;
}
body.dark .col-cart .section-header {
    background: #1e1e1e;
}

.btn-manage{background:transparent;border:1px solid #e5e9ec;padding:.3rem .9rem;border-radius:30px;font-size:.7rem;font-weight:450;color:#4b5563;cursor:pointer;transition:.15s;display:flex;align-items:center;gap:4px;}
.btn-manage:hover{background:#f1f4f6;border-color:#d1d6dc;}
.btn-manage svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
.btn-back{background:transparent;border:1px solid #e5e9ec;padding:.3rem 1rem;border-radius:30px;font-size:.7rem;font-weight:450;cursor:pointer;color:#4b5563;transition:.15s;}
.btn-back:hover{background:#f1f4f6;}
.btn-add-circle{width:42px;height:42px;border-radius:50%;background:#1a1a1a;color:#fff;font-size:1.7rem;font-weight:300;border:none;box-shadow:0 4px 12px rgba(0,0,0,.08);cursor:pointer;transition:.2s;display:flex;align-items:center;justify-content:center;line-height:1;flex-shrink:0;}
.btn-add-circle:hover{transform:scale(1.05);background:#333;box-shadow:0 6px 16px rgba(0,0,0,.12);}

/* ===== 制品卡片 ===== */
.product-card{border:1px solid #edf0f2;border-radius:16px;padding:.9rem 1.1rem 1rem;margin-bottom:.9rem;background:#fff;overflow:hidden;transition:.15s;box-shadow:0 2px 8px rgba(0,0,0,.01);position:relative;}
.product-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,#d1d6dc,#e5e9ec);opacity:.7;}
.product-card:hover{border-color:#d1d6dc;box-shadow:0 6px 18px rgba(0,0,0,.02);}
.card-meta{display:flex;justify-content:space-between;align-items:center;margin-bottom:.65rem;}
.card-index{font-size:.68rem;color:#8a8f99;background:#f1f4f6;padding:.1rem .6rem;border-radius:30px;font-weight:450;}
.delete-item{background:none;border:none;font-size:.75rem;color:#b0b8c0;cursor:pointer;padding:0 .2rem;transition:.15s;}
.delete-item:hover{color:#8a3a2a;}
.select-row{display:flex;flex-wrap:wrap;gap:.5rem;margin-bottom:.65rem;}
.select-field{flex:1 1 140px;min-width:120px;}
.select-field label,.qty-field label{display:block;font-size:.63rem;font-weight:500;color:#6b7280;margin-bottom:.15rem;letter-spacing:.3px;text-transform:uppercase;}
.select-field select,.select-field input,.qty-field input{width:100%;padding:.35rem .6rem;border-radius:10px;border:1px solid #e5e9ec;background:#fff;font-size:.78rem;font-family:inherit;color:#1a1a1a;transition:.15s;}
.select-field select:focus,.select-field input:focus,.qty-field input:focus{outline:none;border-color:#b0b8c0;box-shadow:0 0 0 3px rgba(0,0,0,.02);}
.qty-field{flex:0 1 80px;min-width:68px;}
.qty-field input{text-align:center;}
.extras-panel{display:flex;flex-wrap:wrap;gap:.5rem;margin:.5rem 0 .2rem;padding-top:.4rem;border-top:1px solid #f1f4f6;align-items:center;}
.extra-item{display:inline-flex;align-items:center;gap:.25rem;background:#f8fafc;padding:.15rem .65rem;border-radius:24px;font-size:.7rem;color:#1a1a1a;border:1px solid #edf0f2;}
.extra-item input[type=checkbox]{width:15px;height:15px;accent-color:#1a1a1a;margin-right:2px;}
.extra-item input[type=number]{width:52px;padding:.1rem .2rem;border-radius:8px;border:1px solid #e5e9ec;font-size:.7rem;background:#fff;text-align:center;}
.dynamic-spec{background:#f8fafc;border-radius:12px;padding:.5rem .8rem;margin:.4rem 0 .1rem;font-size:.75rem;border:1px solid #edf0f2;}
.dynamic-spec label{font-size:.63rem;color:#6b7280;display:block;margin-bottom:3px;text-transform:uppercase;letter-spacing:.3px;font-weight:500;}
.dynamic-spec select,.dynamic-spec input{padding:.25rem .5rem;border-radius:8px;border:1px solid #e5e9ec;font-size:.75rem;background:#fff;width:auto;color:#1a1a1a;}
.item-subtotal{text-align:right;font-size:.75rem;font-weight:500;margin-top:.5rem;color:#1a1a1a;background:#f8fafc;padding:.2rem .8rem;border-radius:30px;display:inline-block;float:right;clear:both;border:1px solid #edf0f2;}

/* ===== 全局设置面板 ===== */
.settings-panel{border:1px solid #edf0f2;border-radius:18px;padding:1.1rem 1.3rem;background:#fff;align-self:start;position:sticky;top:.5rem;box-shadow:0 4px 12px rgba(0,0,0,.01);}
.settings-panel .global-title{font-weight:550;font-size:.78rem;color:#1a1a1a;margin-bottom:.7rem;padding-bottom:.4rem;border-bottom:1px solid #edf0f2;background:#f8fafc;margin:-1.1rem -1.3rem .7rem -1.3rem;padding:.75rem 1.3rem;border-radius:18px 18px 0 0;}
.license-express-row{display:flex;align-items:flex-end;gap:.7rem;margin-bottom:.75rem;}
.license-express-row .license-col{flex:1;min-width:0;}
.license-express-row .license-col label{font-size:.68rem;display:block;margin-bottom:.15rem;color:#6b7280;font-weight:500;}
.license-express-row .license-col select{width:100%;padding:.35rem .6rem;border-radius:10px;border:1px solid #e5e9ec;background:#fff;font-size:.78rem;font-family:inherit;color:#1a1a1a;}
.license-express-row .license-col select:focus{outline:none;border-color:#b0b8c0;}
.license-express-row .express-col{flex-shrink:0;display:flex;align-items:center;gap:.3rem;padding-bottom:.15rem;}
.license-express-row .express-col input[type=checkbox]{width:17px;height:17px;accent-color:#1a1a1a;cursor:pointer;margin:0;}
.license-express-row .express-col label{font-size:.73rem;cursor:pointer;white-space:nowrap;color:#4b5563;}
.license-express-row .express-col label:hover{color:#1a1a1a;}
body.dark .license-express-row .express-col label{color:#e0e0e0!important;}
.global-row{margin-bottom:.75rem;}
.global-row label{font-size:.68rem;display:block;margin-bottom:.15rem;color:#6b7280;font-weight:500;}
.global-row select,.global-row input{width:100%;padding:.35rem .6rem;border-radius:10px;border:1px solid #e5e9ec;background:#fff;font-size:.78rem;font-family:inherit;color:#1a1a1a;}
.global-row select:focus,.global-row input:focus{outline:none;border-color:#b0b8c0;}
.global-row .inline-flex{display:flex;align-items:center;gap:.4rem;}
.global-row .inline-flex input{width:80px;flex:none;}
.discount-custom-group{display:none;margin-top:.2rem;}
.discount-custom-group.show{display:block;}
.total-area{background:#f8fafc;border-radius:14px;padding:.9rem;text-align:center;margin:.75rem 0;border:1px solid #edf0f2;position:relative;overflow:hidden;}
.total-area::before{content:'';position:absolute;top:-30px;right:-30px;width:120px;height:120px;background:radial-gradient(circle,rgba(0,0,0,.02) 0%,transparent 70%);border-radius:50%;pointer-events:none;}
.total-area .label{font-size:.68rem;color:#6b7280;font-weight:500;}
.total-area .total-number{font-size:1.9rem;font-weight:550;color:#1a1a1a;letter-spacing:-.5px;line-height:1.2;}
.settings-panel hr{margin:.75rem 0;border:0;height:1px;background:#edf0f2;}
.inline-note{font-size:.63rem;color:#8a8f99;margin-top:.15rem;}
.btn-secondary{background:#fff;border:1px solid #e5e9ec;width:100%;padding:.4rem;border-radius:40px;font-size:.7rem;font-weight:450;cursor:pointer;color:#1a1a1a;transition:.15s;margin-top:.4rem;}
.btn-secondary:hover{background:#f8fafc;border-color:#d1d6dc;}
.btn-dark{background:#1a1a1a;border:1px solid #1a1a1a;color:#fff;}
.btn-dark:hover{background:#333;border-color:#333;}
.data-actions{display:flex;gap:.5rem;margin-top:.5rem;flex-wrap:wrap;}
.data-actions .btn-sm{flex:1;padding:.35rem;border-radius:30px;font-size:.7rem;font-weight:450;cursor:pointer;border:1px solid #d1d6dc;background:#fff;color:#1a1a1a;transition:.15s;text-align:center;min-width:60px;}
.data-actions .btn-sm:hover{background:#f8fafc;border-color:#b0b8c0;}

/* ===== 小票预览 ===== */
.preview-panel{border:1px solid #edf0f2;border-radius:18px;padding:1.1rem 1.3rem;background:#fff;align-self:start;position:sticky;top:.5rem;max-height:calc(100vh - 140px);overflow-y:auto;box-shadow:0 4px 12px rgba(0,0,0,.01);color:#1a1a1a!important;}
.preview-panel .preview-title{font-weight:550;font-size:.78rem;color:#1a1a1a;margin-bottom:.6rem;padding-bottom:.4rem;border-bottom:1px solid #edf0f2;text-align:center;letter-spacing:.5px;background:#f8fafc;margin:-1.1rem -1.3rem 1rem -1.3rem;padding:.75rem 1.3rem;border-radius:18px 18px 0 0;}
.preview-panel .preview-empty{text-align:center;color:#b0b8c0;font-size:.75rem;padding:2rem 0;}
.preview-panel .preview-time{text-align:center;font-size:.62rem;color:#8a8f99;margin-bottom:.7rem;font-weight:450;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;}
.preview-panel .preview-item{display:flex;justify-content:space-between;font-size:.72rem;padding:.2rem 0;border-bottom:1px dashed #edf0f2;color:#1a1a1a;}
.preview-panel .preview-item .left{flex:1;padding-right:.5rem;}
.preview-panel .preview-item .right{white-space:nowrap;font-weight:500;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;}
.preview-panel .preview-divider{border-top:2px dashed #e5e9ec;margin:.5rem 0;}
.preview-panel .preview-row{display:flex;justify-content:space-between;font-size:.72rem;padding:.15rem 0;color:#1a1a1a;}
.preview-panel .preview-row .right{font-weight:500;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;}
.preview-panel .preview-total{display:flex;justify-content:space-between;font-size:.95rem;font-weight:600;padding:.4rem 0 .2rem;border-top:2px solid #d1d6dc;color:#1a1a1a;margin-top:.2rem;}
.preview-panel .preview-total span:last-child{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;}
.preview-panel .preview-footer{text-align:center;font-size:.6rem;color:#b0b8c0;margin-top:.6rem;border-top:1px dashed #e5e9ec;padding-top:.5rem;letter-spacing:.5px;}
.preview-panel::-webkit-scrollbar{width:4px;}
.preview-panel::-webkit-scrollbar-thumb{background:#d1d6dc;border-radius:4px;}
.preview-panel::-webkit-scrollbar-track{background:#f1f4f6;}

/* 小票图片区 */
.preview-image-section{margin-top:.7rem;border-top:1px solid #edf0f2;padding-top:.6rem;}
.preview-image-section .btn-secondary{background:#f5f5f3;border:1px solid #d5d5d0;border-radius:30px;padding:.15rem .8rem;font-size:.65rem;font-weight:450;cursor:pointer;color:#1a1a1a;transition:.15s;display:inline-block;margin:0;}
.preview-image-section .btn-secondary:hover{background:#e8e8e4;}
#stampImageDisplay{transition:width .15s;max-height:150px;object-fit:contain;}

/* ===== 制品管理 ===== */
.lib-panels{display:flex;flex-wrap:wrap;gap:1.4rem;margin-top:.2rem;}
.lib-panels .lib-left{flex:0 0 320px;min-width:260px;}
.lib-panels .lib-right{flex:1;min-width:320px;}
.lib-card{border:1px solid #edf0f2;border-radius:18px;padding:1.4rem 1.6rem;background:#fff;height:100%;box-shadow:0 2px 8px rgba(0,0,0,.01);}
.lib-card .lib-title{font-weight:550;font-size:.95rem;color:#1a1a1a;margin-bottom:.8rem;padding-bottom:.5rem;border-bottom:1px solid #edf0f2;display:flex;justify-content:space-between;align-items:center;background:#f8fafc;margin:-1.4rem -1.6rem 1rem -1.6rem;padding:.8rem 1.6rem;border-radius:18px 18px 0 0;}
.lib-card .lib-title .badge{font-size:.72rem;font-weight:400;color:#6b7280;background:#edf0f2;padding:.1rem .7rem;border-radius:30px;}
.lib-item{display:flex;align-items:center;justify-content:space-between;padding:.65rem .4rem;border-bottom:1px solid #f1f4f6;font-size:.9rem;gap:.6rem;cursor:grab;transition:background .15s;user-select:none;}
.lib-item:last-child{border-bottom:none;}
.lib-item.dragging{opacity:.4;background:#f1f4f6;}
.lib-item.drag-over{border-bottom:2px solid #1a1a1a;padding-bottom:calc(.65rem - 2px);}
.lib-item .lib-label{flex:1;color:#1a1a1a;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;line-height:1.4;}
.lib-item .lib-label .sub{font-size:.75rem;color:#8a8f99;margin-left:.4rem;}
.lib-item .lib-actions{display:flex;gap:.4rem;flex-shrink:0;align-items:center;}
.lib-item .lib-actions button{background:none;border:none;font-size:.82rem;color:#b0b8c0;cursor:pointer;padding:0 .25rem;transition:.15s;line-height:1.4;min-width:24px;text-align:center;}
.lib-item .lib-actions button:hover{color:#1a1a1a;}
.lib-item .lib-actions .del:hover{color:#8a3a2a;}
.lib-item .lib-price{font-size:.82rem;color:#4b5563;margin-right:.4rem;white-space:nowrap;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;}
.lib-item.lib-active{background:#f1f4f6;border-radius:8px;padding:.65rem .8rem;margin:0 -.4rem;}
.lib-add-row{display:flex;gap:.6rem;margin-top:.9rem;flex-wrap:wrap;}
.lib-add-row input{flex:1;min-width:80px;padding:.5rem .75rem;border-radius:10px;border:1px solid #e5e9ec;font-size:.85rem;background:#fff;color:#1a1a1a;}

<script>
/* ============================================================
   0. 初始化 Supabase 和 云同步机制
============================================================ */
const SUPABASE_URL = 'https://dagyuvmabfnfueltpwuk.supabase.co';
const SUPABASE_KEY = 'sb_publishable_QuVJCLQavyYVqqyhh5RKUw_PEsKhg2Y';
const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let syncTimer = null;
let isSyncing = false; // 同步锁防止并发竞态
let syncPending = false;
let isUserInteracted = false; // 防覆盖标记

function setSyncStatus(status, text) {
    const el = document.getElementById('cloudStatus');
    const txt = document.getElementById('cloudStatusText');
    if(!el || !txt) return;
    el.className = 'cloud-status ' + status;
    txt.innerText = text;
}

async function syncNow() {
    if (isSyncing) {
        syncPending = true;
        return;
    }
    isSyncing = true;
    setSyncStatus('syncing', '同步中...');
    
    try {
        const state = {
            productLibrary: productLibrary,
            productItems: productItems,
            nextId: nextId,
            orderCounter: localStorage.getItem('orderCounter') || '0',
            stampPreset: { image: stampImageData, size: stampImageSize },
            settings: {
                license: document.getElementById('licenseSelect').value,
                express: document.getElementById('expressCheck').checked,
                deposit: document.getElementById('depositCheck').checked,
                designModFee: document.getElementById('designModFee').value,
                extraHandFee: document.getElementById('extraHandFee').value,
                discountSelect: document.getElementById('discountSelect').value,
                discountCustomValue: document.getElementById('discountCustomValue').value,
                discountFixed: document.getElementById('discountFixed').value,
                rounding: document.getElementById('roundingSelect').value
            }
        };
        
        const contentStr = JSON.stringify(state);
        const dateStr = new Date().toISOString();
        
        const { error } = await supabaseClient
            .from('records')
            .insert([{ content: contentStr, date: dateStr }]);
            
        if (error) throw error;
        
        setSyncStatus('synced', '已同步');
        localStorage.setItem('app_state_backup', contentStr);
    } catch (err) {
        console.error('同步失败:', err);
        let errMsg = '同步失败';
        if (err.message && err.message.includes('fetch')) {
            errMsg = '网络错误，请用服务器打开';
            if (window.location.protocol === 'file:') {
                errMsg = '请勿双击打开，需部署或本地服务器运行';
            }
        } else if (err.message && err.message.includes('policy')) {
            errMsg = '无权限，请检查Supabase策略';
        }
        setSyncStatus('error', errMsg);
        
        // 保存本地
        const state = {
            productLibrary: productLibrary,
            productItems: productItems,
            nextId: nextId,
            orderCounter: localStorage.getItem('orderCounter') || '0',
            stampPreset: { image: stampImageData, size: stampImageSize },
            settings: {
                license: document.getElementById('licenseSelect').value,
                express: document.getElementById('expressCheck').checked,
                deposit: document.getElementById('depositCheck').checked,
                designModFee: document.getElementById('designModFee').value,
                extraHandFee: document.getElementById('extraHandFee').value,
                discountSelect: document.getElementById('discountSelect').value,
                discountCustomValue: document.getElementById('discountCustomValue').value,
                discountFixed: document.getElementById('discountFixed').value,
                rounding: document.getElementById('roundingSelect').value
            }
        };
        localStorage.setItem('app_state_backup', JSON.stringify(state));
    } finally {
        isSyncing = false;
        if (syncPending) {
            syncPending = false;
            syncNow();
        }
    }
}

function triggerCloudSync(immediate = false) {
    isUserInteracted = true;
    clearTimeout(syncTimer);
    
    if (immediate) {
        syncNow();
    } else {
        setSyncStatus('syncing', '等待同步...');
        syncTimer = setTimeout(syncNow, 600); 
    }
}

async function loadFromCloud() {
    setSyncStatus('syncing', '拉取数据...');
    try {
        const { data, error } = await supabaseClient
            .from('records')
            .select('content')
            .order('date', { ascending: false })
            .limit(1);
            
        if (error) throw error;
        
        if (data && data.length > 0) {
            // 如果用户已经操作了界面，不要用云端覆盖
            if (isUserInteracted) {
                console.log('用户已操作，跳过云端数据应用以保护本地修改');
                return;
            }
            
            const state = JSON.parse(data[0].content);
            applyCloudState(state);
            setSyncStatus('synced', '已同步');
            localStorage.setItem('app_state_backup', data[0].content);
        } else {
            setSyncStatus('synced', '新建记录');
            triggerCloudSync(true);
        }
    } catch (err) {
        console.error('拉取失败:', err);
        let errMsg = '离线缓存';
        if (err.message && err.message.includes('fetch')) {
            errMsg = '网络受限，使用本地';
        }
        setSyncStatus('error', errMsg);
        
        try {
            const localRaw = localStorage.getItem('app_state_backup');
            if (localRaw && !isUserInteracted) {
                applyCloudState(JSON.parse(localRaw));
            } else if (!productLibrary) {
                loadLibrary(); 
            }
        } catch(e) {
            if (!productLibrary) loadLibrary();
        }
    }
}

function applyCloudState(state) {
    if (state.productLibrary) {
        productLibrary = state.productLibrary;
    } else {
        loadLibrary();
    }
    
    if (state.productItems) productItems = state.productItems;
    if (state.nextId) nextId = state.nextId;
    if (state.orderCounter) localStorage.setItem('orderCounter', state.orderCounter);
    if (state.stampPreset) {
        stampImageData = state.stampPreset.image || null;
        stampImageSize = state.stampPreset.size || 60;
    }
    
    if (state.settings) {
        const s = state.settings;
        if (s.license) document.getElementById('licenseSelect').value = s.license;
        if (s.express !== undefined) document.getElementById('expressCheck').checked = s.express;
        if (s.deposit !== undefined) document.getElementById('depositCheck').checked = s.deposit;
        if (s.designModFee !== undefined) document.getElementById('designModFee').value = s.designModFee;
        if (s.extraHandFee !== undefined) document.getElementById('extraHandFee').value = s.extraHandFee;
        if (s.discountSelect) document.getElementById('discountSelect').value = s.discountSelect;
        if (s.discountCustomValue !== undefined) document.getElementById('discountCustomValue').value = s.discountCustomValue;
        if (s.discountFixed !== undefined) document.getElementById('discountFixed').value = s.discountFixed;
        if (s.rounding) document.getElementById('roundingSelect').value = s.rounding;
        
        const ds = document.getElementById('discountSelect');
        document.getElementById('discountCustomGroup').classList.toggle('show', ds.value === 'custom');
    }
    
    renderAllProducts();
    updateTotal();
    applyStampImage();
}

const DEFAULT_LIBRARY={categories:[
    {id:'cat_badge',name:'徽章类',types:[
        {id:'type_circular',label:'圆形吧唧',basePrice:20},

let productLibrary = null, selectedCategoryId = null;
let dragState = {type:null, sourceId:null, sourceCatId:null};

function loadLibrary(){
    if(!productLibrary) {
        productLibrary = JSON.parse(JSON.stringify(DEFAULT_LIBRARY));
        triggerCloudSync(true);
    }
}

// 传入 immediate=true 则立即同步（用于关键修改）
function saveLibrary(immediate = false){
    triggerCloudSync(immediate); 
    refreshAllProductSelects();
    if(document.getElementById('pricing-section').classList.contains('show-library')) renderLibrary();
}

function getCategory(id){return productLibrary.categories.find(c=>c.id===id);}
function getTypeById(tid){for(let c of productLibrary.categories){for(let t of c.types){if(t.id===tid)return{categoryId:c.id,type:t};}}return null;}
function generateId(){return Date.now().toString(36)+Math.random().toString(36).substr(2,4);}

/* 拖拽 */
function handleCategoryDragStart(e,cid){dragState.type='category';dragState.sourceId=cid;e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain',cid);setTimeout(()=>e.target.closest('.lib-item')?.classList.add('dragging'),0);}
function handleCategoryDragEnd(e){e.target.closest('.lib-item')?.classList.remove('dragging');document.querySelectorAll('.lib-item.drag-over').forEach(el=>el.classList.remove('drag-over'));}
function handleCategoryDragOver(e){e.preventDefault();const t=e.target.closest('.lib-item');if(!t||t.dataset.catid===dragState.sourceId)return;document.querySelectorAll('.lib-item.drag-over').forEach(el=>el.classList.remove('drag-over'));t.classList.add('drag-over');}
function handleCategoryDragLeave(e){e.target.closest('.lib-item')?.classList.remove('drag-over');}
function handleCategoryDrop(e){e.preventDefault();const t=e.target.closest('.lib-item');if(!t)return;t.classList.remove('drag-over');const tid=t.dataset.catid;if(!tid||tid===dragState.sourceId)return;const a=productLibrary.categories.findIndex(c=>c.id===dragState.sourceId),b=productLibrary.categories.findIndex(c=>c.id===tid);if(a<0||b<0)return;[productLibrary.categories[a],productLibrary.categories[b]]=[productLibrary.categories[b],productLibrary.categories[a]];saveLibrary(true);}
function handleTypeDragStart(e,cid,tid){dragState.type='type';dragState.sourceId=tid;dragState.sourceCatId=cid;e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain',tid);setTimeout(()=>e.target.closest('.lib-item')?.classList.add('dragging'),0);}
function handleTypeDragEnd(e){e.target.closest('.lib-item')?.classList.remove('dragging');document.querySelectorAll('.lib-item.drag-over').forEach(el=>el.classList.remove('drag-over'));}
function handleTypeDragOver(e){e.preventDefault();const t=e.target.closest('.lib-item');if(!t||t.dataset.typeid===dragState.sourceId)return;document.querySelectorAll('.lib-item.drag-over').forEach(el=>el.classList.remove('drag-over'));t.classList.add('drag-over');}
function handleTypeDragLeave(e){e.target.closest('.lib-item')?.classList.remove('drag-over');}
function handleTypeDrop(e){e.preventDefault();const t=e.target.closest('.lib-item');if(!t)return;t.classList.remove('drag-over');const tid=t.dataset.typeid;if(!tid||tid===dragState.sourceId)return;const c=getCategory(dragState.sourceCatId);if(!c)return;const a=c.types.findIndex(x=>x.id===dragState.sourceId),b=c.types.findIndex(x=>x.id===tid);if(a<0||b<0)return;[c.types[a],c.types[b]]=[c.types[b],c.types[a]];saveLibrary(true);}

/* CRUD 全部改为立即同步 saveLibrary(true) */
function addCategory(name){const t=name.trim();if(!t||productLibrary.categories.some(c=>c.name===t))return false;productLibrary.categories.push({id:'cat_'+generateId(),name:t,types:[]});saveLibrary(true);return true;}
function renameCategory(cid,newName){const t=newName.trim();if(!t)return false;const c=getCategory(cid);if(!c)return false;if(productLibrary.categories.some(x=>x.name===t&&x.id!==cid))return false;c.name=t;saveLibrary(true);return true;}
function deleteCategory(cid){const c=getCategory(cid);if(!c)return false;if(c.types.length>0){if(!confirm(`分类 "${c.name}" 下还有 ${c.types.length} 个制品，确认删除？`))return false;}else{if(!confirm(`确认删除分类 "${c.name}"？`))return false;}productItems=productItems.filter(i=>{const info=getTypeById(i.typeId);return!(info&&info.categoryId===cid);});productLibrary.categories=productLibrary.categories.filter(x=>x.id!==cid);if(selectedCategoryId===cid)selectedCategoryId=null;saveLibrary(true);renderAllProducts();updateTotal();return true;}
function addType(cid,label,price){const t=label.trim();if(!t)return false;const c=getCategory(cid);if(!c)return false;const p=parseFloat(price);if(isNaN(p)||p<0)return false;c.types.push({id:'type_'+generateId(),label:t,basePrice:Math.round(p*100)/100});saveLibrary(true);return true;}
function renameType(cid,tid,newLabel){const t=newLabel.trim();if(!t)return false;const c=getCategory(cid);if(!c)return false;const x=c.types.find(tp=>tp.id===tid);if(!x)return false;x.label=t;saveLibrary(true);renderAllProducts();updateTotal();return true;}
function updateTypePrice(cid,tid,newPrice){const p=parseFloat(newPrice);if(isNaN(p)||p<0)return false;const c=getCategory(cid);if(!c)return false;const x=c.types.find(tp=>tp.id===tid);if(!x)return false;x.basePrice=Math.round(p*100)/100;saveLibrary(true);renderAllProducts();updateTotal();return true;}
function deleteType(cid,tid){const c=getCategory(cid);if(!c)return false;const x=c.types.find(tp=>tp.id===tid);if(!x)return false;if(!confirm(`确认删除制品 "${x.label}"？`))return false;productItems=productItems.filter(i=>i.typeId!==tid);c.types=c.types.filter(tp=>tp.id!==tid);saveLibrary(true);renderAllProducts();updateTotal();return true;}

/* 渲染管理 */
function renderLibrary(){renderCategoryList();renderTypeList();document.getElementById('catCount').textContent=productLibrary.categories.length;}
function renderCategoryList(){const c=document.getElementById('categoryList');if(!productLibrary.categories.length){c.innerHTML='<div class="lib-empty">暂无分类，添加一个吧</div>';return;}let h='';for(let i=0;i<productLibrary.categories.length;i++){const cat=productLibrary.categories[i];const active=selectedCategoryId===cat.id?'lib-active':'';h+=`<div class="lib-item ${active}" data-catid="${cat.id}" draggable="true"><span class="lib-label" data-catid="${cat.id}" style="cursor:pointer;">${cat.name} <span class="sub">(${cat.types.length})</span></span><div class="lib-actions"><button class="edit-cat" data-catid="${cat.id}" title="重命名">✎</button><button class="del" data-catid="${cat.id}" title="删除">✕</button></div></div>`;}c.innerHTML=h;
c.querySelectorAll('.lib-item[draggable=true]').forEach(el=>{const cid=el.dataset.catid;el.addEventListener('dragstart',e=>handleCategoryDragStart(e,cid));el.addEventListener('dragend',handleCategoryDragEnd);el.addEventListener('dragover',handleCategoryDragOver);el.addEventListener('dragleave',handleCategoryDragLeave);el.addEventListener('drop',handleCategoryDrop);});
c.querySelectorAll('.lib-label[data-catid]').forEach(el=>el.addEventListener('click',function(){selectedCategoryId=this.dataset.catid;renderLibrary();}));
c.querySelectorAll('.edit-cat').forEach(b=>b.addEventListener('click',function(e){e.stopPropagation();const cat=getCategory(this.dataset.catid);if(!cat)return;const nn=prompt('修改分类名称：',cat.name);if(nn!==null&&nn.trim()&&nn.trim()!==cat.name)renameCategory(this.dataset.catid,nn.trim());}));
c.querySelectorAll('.del[data-catid]').forEach(b=>b.addEventListener('click',function(e){e.stopPropagation();deleteCategory(this.dataset.catid);}));
if(!selectedCategoryId&&productLibrary.categories.length){selectedCategoryId=productLibrary.categories[0].id;renderLibrary();}}

function renderTypeList(){const c=document.getElementById('typeList');const t=document.getElementById('libTypeTitle');const ce=document.getElementById('typeCount');if(!selectedCategoryId||!getCategory(selectedCategoryId)){if(productLibrary.categories.length){selectedCategoryId=productLibrary.categories[0].id;renderLibrary();return;}t.textContent='制品管理';ce.textContent='0';c.innerHTML='<div class="lib-empty">请先添加分类</div>';return;}const cat=getCategory(selectedCategoryId);t.textContent=`制品管理 · ${cat.name}`;ce.textContent=cat.types.length;if(!cat.types.length){c.innerHTML='<div class="lib-empty">该分类下暂无制品，添加一个吧</div>';return;}let h='';for(let i=0;i<cat.types.length;i++){const x=cat.types[i];h+=`<div class="lib-item" data-typeid="${x.id}" draggable="true"><span class="lib-label">${x.label}</span><span class="lib-price">¥${x.basePrice.toFixed(2)}</span><div class="lib-actions"><button class="edit-type" data-catid="${selectedCategoryId}" data-typeid="${x.id}" title="重命名">✎</button><button class="edit-price" data-catid="${selectedCategoryId}" data-typeid="${x.id}" title="改价">¥</button><button class="del" data-catid="${selectedCategoryId}" data-typeid="${x.id}" title="删除">✕</button></div></div>`;}c.innerHTML=h;
c.querySelectorAll('.lib-item[draggable=true]').forEach(el=>{const tid=el.dataset.typeid,cid=selectedCategoryId;el.addEventListener('dragstart',e=>handleTypeDragStart(e,cid,tid));el.addEventListener('dragend',handleTypeDragEnd);el.addEventListener('dragover',handleTypeDragOver);el.addEventListener('dragleave',handleTypeDragLeave);el.addEventListener('drop',handleTypeDrop);});
c.querySelectorAll('.edit-type').forEach(b=>b.addEventListener('click',function(){const info=getTypeById(this.dataset.typeid);if(!info)return;const nn=prompt('修改制品名称：',info.type.label);if(nn!==null&&nn.trim()&&nn.trim()!==info.type.label)renameType(this.dataset.catid,this.dataset.typeid,nn.trim());}));
c.querySelectorAll('.edit-price').forEach(b=>b.addEventListener('click',function(){const info=getTypeById(this.dataset.typeid);if(!info)return;const np=prompt('修改基础单价 (¥)：',info.type.basePrice);if(np!==null){const v=parseFloat(np);if(!isNaN(v)&&v>=0)updateTypePrice(this.dataset.catid,this.dataset.typeid,v);else alert('请输入有效价格');}}));
c.querySelectorAll('.del[data-typeid]').forEach(b=>b.addEventListener('click',function(){deleteType(this.dataset.catid,this.dataset.typeid);}));}

document.getElementById('addCatBtn').addEventListener('click',function(){const input=document.getElementById('newCatInput');if(addCategory(input.value)){input.value='';const nc=productLibrary.categories[productLibrary.categories.length-1];selectedCategoryId=nc.id;renderLibrary();}else alert('请输入有效的分类名称（不可重复）');});

function getTypesForCategory(cid){const c=getCategory(cid);return c?c.types:[];}
function getTypeLabel(tid){const i=getTypeById(tid);return i?i.type.label:'(已删除)';}

   2. 计价器
============================================================ */
let nextId=1,productItems=[];

function getDefaultDynamicParams(tid){const l=getTypeLabel(tid);let d={};if(l.includes('立牌'))d.standType='single';else if(l.includes('挂件')||l.includes('杯垫'))d.extraFaceNum=0;else if(l.includes('长宣'))d.longTotalNum=0;else if(l.includes('流麻')||l.includes('砖'))d.liumaExtraLayer=0;else if(l.includes('亚克力类')||l.includes('自定义单价'))d.acrylicCustomPrice=30;else if(l.includes('书封')||l.includes('纸袋')||l.includes('海报'))d.customOtherPrice=20;else if(tid==='type_generic_custom'){d.customName='';d.customPrice=20;}return d;}

function addProduct(){if(!productLibrary.categories.length){alert('请先在「管理制品」中添加分类和制品');return;}const fc=productLibrary.categories[0];const ft=fc.types.length?fc.types[0].id:null;if(!ft){alert('请先在「管理制品」中添加制品');return;}productItems.push({id:nextId++,categoryId:fc.id,typeId:ft,quantity:1,whiteInk:false,specialShape:false,cutoutFee:0,dynamicParams:getDefaultDynamicParams(ft)});renderAllProducts();updateTotal();triggerCloudSync(true);}
function deleteProduct(i){if(i>=0&&i<productItems.length){productItems.splice(i,1);renderAllProducts();updateTotal();triggerCloudSync(true);}}
function clearAllProducts(){productItems=[];renderAllProducts();updateTotal();triggerCloudSync(true);}

function getDynamicDesc(item){const info=getTypeById(item.typeId);if(!info)return '(已删除)';if(item.typeId==='type_generic_custom')return '';const d=item.dynamicParams||{};const l=info.type.label;if(l.includes('立牌')){const m={single:'单插',double:'双插',triple:'三插',full:'满版'};return m[d.standType]||'标准';}if(l.includes('挂件')||l.includes('杯垫'))return `额外面数: ${d.extraFaceNum||0}`;if(l.includes('长宣'))return `总制品数: ${d.longTotalNum||0}`;if(l.includes('流麻')||l.includes('砖'))return `额外层数: ${d.liumaExtraLayer||0}`;if(l.includes('亚克力类')||l.includes('自定义单价'))return `自定义单价: ¥${d.acrylicCustomPrice||30}`;if(l.includes('书封')||l.includes('纸袋')||l.includes('海报'))return `自定义单价: ¥${d.customOtherPrice||20}`;return '';}

function computeSingleItemTotal(item){const q=item.quantity;if(!q)return 0;const info=getTypeById(item.typeId);if(!info)return 0;const d=item.dynamicParams||{};let base=info.type.basePrice,extra=0;const l=info.type.label;
if(item.typeId==='type_generic_custom'){const v=parseFloat(d.customPrice);if(!isNaN(v)&&v>=0)base=v;else base=20;}
else if(l.includes('挂件')||l.includes('杯垫')){base=20;const ef=d.extraFaceNum||0;if(ef>0)extra=q*ef*10;}
else if(l.includes('长宣')){base=45;const tn=d.longTotalNum||0;const ec=Math.max(0,tn-5);if(ec>0)extra=ec*10;}
else if(l.includes('流麻')||l.includes('砖')){base=25;const el=d.liumaExtraLayer||0;if(el>0)extra=q*el*10;}
else if(l.includes('立牌')){const st=d.standType||'single';if(st==='single')base=30;else if(st==='double')base=45;else if(st==='triple')base=55;else if(st==='full')base=65;}
else if(l.includes('亚克力类')||l.includes('自定义单价')){const v=parseFloat(d.acrylicCustomPrice);if(!isNaN(v)&&v>0)base=v;else base=30;}
else if(l.includes('书封')||l.includes('纸袋')||l.includes('海报')){const v=parseFloat(d.customOtherPrice);if(!isNaN(v)&&v>0)base=v;else base=20;}
let per=0;if(item.whiteInk)per+=5;if(item.specialShape)per+=5;per+=item.cutoutFee||0;
return Math.round(((base+per)*q+extra)*100)/100;}

function getRawProductsSum(){let s=0;for(let i of productItems)s+=computeSingleItemTotal(i);return s;}
function getDiscountRate(){const v=document.getElementById('discountSelect').value;if(v==='custom'){const c=parseFloat(document.getElementById('discountCustomValue').value);return(!isNaN(c)&&c>0&&c<=10)?c/10:1;}const n=parseFloat(v);return(!isNaN(n)&&n>=.1&&n<=10)?n/10:1;}
function getDiscountDisplay(){const v=document.getElementById('discountSelect').value;if(v==='custom'){const c=parseFloat(document.getElementById('discountCustomValue').value);return(!isNaN(c)&&c>0&&c<=10)?c+'折':'原价';}const n=parseFloat(v);return(!isNaN(n)&&n>=.1&&n<=10)?n+'折':'原价';}
function getRounding(){return document.getElementById('roundingSelect').value;}
function applyRounding(num){const m=getRounding();if(m==='ten')return Math.floor(num/10)*10;if(m==='hundred')return Math.floor(num/100)*100;return num;}
function computeFinalTotal(){let t=getRawProductsSum();t+=parseFloat(document.getElementById('designModFee')?.value)||0;t+=parseFloat(document.getElementById('extraHandFee')?.value)||0;t*=parseFloat(document.getElementById('licenseSelect')?.value)||1;t*=getDiscountRate();t-=parseFloat(document.getElementById('discountFixed')?.value)||0;if(document.getElementById('expressCheck')?.checked)t*=1.5;if(t<0)t=0;t=applyRounding(t);return Math.round(t*100)/100;}

function updateTotal(){const v=computeFinalTotal();document.getElementById('grandTotal').innerText=v.toFixed(2);for(let i=0;i<productItems.length;i++){const s=document.getElementById(`item-subtotal-${i}`);if(s)s.innerText=`单品小计: ¥${computeSingleItemTotal(productItems[i]).toFixed(2)}`;}renderReceiptPreview();}

/* 小票预览 */
function renderReceiptPreview(){const c=document.getElementById('receiptPreviewContent');if(!c)return;
if(!productItems.length){c.innerHTML='<div class="preview-empty">暂无项目</div>';syncStampToReceipt();return;}
let items='',totalRaw=0,count=0;
for(let item of productItems){const q=item.quantity;if(!q)continue;count++;let l=getTypeLabel(item.typeId);if(item.typeId==='type_generic_custom')l=item.dynamicParams?.customName||'其他';const sub=computeSingleItemTotal(item);totalRaw+=sub;const dd=getDynamicDesc(item);const ex=[];if(item.whiteInk)ex.push('白墨');if(item.specialShape)ex.push('异形');if(item.cutoutFee>0)ex.push(`抠图+${item.cutoutFee}`);const es=ex.length?` [${ex.join('·')}]`:'';const dn=`${l}${dd?'('+dd+')':''}${es}`;items+=`<div class="preview-item"><span class="left">${count}. ${dn} ×${q}</span><span class="right">¥${sub.toFixed(2)}</span></div>`;}
const df=parseFloat(document.getElementById('designModFee')?.value)||0;
const eh=parseFloat(document.getElementById('extraHandFee')?.value)||0;
const dfix=parseFloat(document.getElementById('discountFixed')?.value)||0;
const lic=parseFloat(document.getElementById('licenseSelect')?.value)||1;
const ie=document.getElementById('expressCheck')?.checked||false;
const dd=getDiscountDisplay();
const tf=computeFinalTotal();
const now=new Date();
const ts=now.toLocaleString('zh-CN',{hour12:false});
let exRows='';
if(df>0)exRows+=`<div class="preview-row"><span>设计修改费</span><span class="right">+¥${df.toFixed(2)}</span></div>`;
if(eh>0)exRows+=`<div class="preview-row"><span>手工附加费</span><span class="right">+¥${eh.toFixed(2)}</span></div>`;
if(dfix>0)exRows+=`<div class="preview-row"><span>立减金额</span><span class="right">-¥${dfix.toFixed(2)}</span></div>`;

const isDeposit = document.getElementById('depositCheck')?.checked || false;
let depositRows = '';
if (isDeposit) {
    const dep = tf * 0.3;
    const bal = tf - dep;
    depositRows = `<div class="preview-divider" style="border-top:1px dashed #e5e9ec;"></div><div class="preview-row" style="color:#d9534f;font-weight:600;"><span>定金 (30%)</span><span class="right">¥${dep.toFixed(2)}</span></div><div class="preview-row" style="font-weight:600;"><span>尾款 (70%)</span><span class="right">¥${bal.toFixed(2)}</span></div>`;
}
const html=`<div class="preview-time">${ts}</div>${items}<div class="preview-divider"></div><div class="preview-row"><span>小计</span><span class="right">¥${totalRaw.toFixed(2)}</span></div>${exRows}<div class="preview-row"><span>授权倍率</span><span class="right">×${lic.toFixed(1)}</span></div><div class="preview-row"><span>折扣</span><span class="right">${dd}</span></div><div class="preview-row"><span>加急订单</span><span class="right">${ie?'是 (×1.5)':'否'}</span></div><div class="preview-total"><span>总计</span><span>¥${tf.toFixed(2)}</span></div>${depositRows}<div class="preview-footer" style="margin-top:.8rem;">感谢惠顾！</div>`;
c.innerHTML=html;
const p=document.getElementById('previewPanel');if(p)p.scrollTop=0;
syncStampToReceipt();}

    </div>`;
}
else if(tl.includes('立牌'))dh=`<div class="dynamic-spec"><label>立牌类型</label><select data-dyn-stand="${i}"><option value="single" ${d.standType==='single'?'selected':''}>单插立牌 (30元)</option><option value="double" ${d.standType==='double'?'selected':''}>双插立牌 (45元)</option><option value="triple" ${d.standType==='triple'?'selected':''}>三插立牌 (55元)</option><option value="full" ${d.standType==='full'?'selected':''}>满版立牌 (65元)</option></select></div>`;
else if(tl.includes('挂件')||tl.includes('杯垫'))dh=`<div class="dynamic-spec"><label>额外多面数量 (每面 +10元/个)</label><input type="number" data-dyn-face="${i}" value="${d.extraFaceNum||0}" min="0" step="1" style="width:90px;"></div>`;
else if(tl.includes('长宣'))dh=`<div class="dynamic-spec"><label>总制品数（个）— 超出5个每个+10元</label><input type="number" data-dyn-longtotal="${i}" value="${d.longTotalNum||0}" min="0" step="1" style="width:90px;"></div>`;
else if(tl.includes('流麻')||tl.includes('砖'))dh=`<div class="dynamic-spec"><label>额外增加层数 (每层+10元/个)</label><input type="number" data-dyn-layer="${i}" value="${d.liumaExtraLayer||0}" min="0" step="1" style="width:90px;"></div>`;
else if(tl.includes('亚克力类')||tl.includes('自定义单价'))dh=`<div class="dynamic-spec"><label>自定义单价 (元/个)</label><input type="number" data-dyn-acrylic="${i}" value="${d.acrylicCustomPrice||30}" min="1" step="1" style="width:90px;"></div>`;
else if(tl.includes('书封')||tl.includes('纸袋')||tl.includes('海报'))dh=`<div class="dynamic-spec"><label>自定义单价 (元/个)</label><input type="number" data-dyn-custom="${i}" value="${d.customOtherPrice||20}" min="1" step="1" style="width:90px;"></div>`;
html+=`<div class="product-card" data-card-idx="${i}"><div class="card-meta"><span class="card-index">项目 ${i+1}</span><button class="delete-item" data-delidx="${i}">移除</button></div><div class="select-row"><div class="select-field"><label>品类</label><select class="category-select" data-catidx="${i}">${co}</select></div><div class="select-field"><label>制品类型</label><select class="type-select" data-typeidx="${i}">${to}</select></div><div class="qty-field"><label>数量</label><input type="number" class="item-qty" data-qtyidx="${i}" value="${item.quantity}" min="0" step="1"></div></div>${dh}<div class="extras-panel"><label class="extra-item"><input type="checkbox" class="white-ink" data-whiteidx="${i}" ${item.whiteInk?'checked':''}> 白墨 (+5/个)</label><label class="extra-item"><input type="checkbox" class="special-shape" data-shapeidx="${i}" ${item.specialShape?'checked':''}> 异形 (+5/个)</label><label class="extra-item"> 抠图费 <input type="number" class="cutout-fee" data-cutidx="${i}" value="${item.cutoutFee||0}" min="0" step="1" style="width:60px;" placeholder="按难度"> 元/个</label></div><div class="item-subtotal" id="item-subtotal-${i}">单品小计: ¥${computeSingleItemTotal(item).toFixed(2)}</div></div>`;}
c.innerHTML=html;
for(let i=0;i<productItems.length;i++)attachCardEvents(i);
renderReceiptPreview();}

function attachCardEvents(idx){
document.querySelector(`.category-select[data-catidx="${idx}"]`)?.addEventListener('change',function(){const ncid=this.value;const types=getTypesForCategory(ncid);if(types.length){productItems[idx].categoryId=ncid;productItems[idx].typeId=types[0].id;productItems[idx].dynamicParams=getDefaultDynamicParams(types[0].id);}renderAllProducts();updateTotal();triggerCloudSync(true);});
document.querySelector(`.type-select[data-typeidx="${idx}"]`)?.addEventListener('change',function(){const ntid=this.value;const info=getTypeById(ntid);if(info){productItems[idx].typeId=ntid;productItems[idx].categoryId=info.categoryId;productItems[idx].dynamicParams=getDefaultDynamicParams(ntid);}renderAllProducts();updateTotal();triggerCloudSync(true);});
document.querySelector(`.item-qty[data-qtyidx="${idx}"]`)?.addEventListener('input',function(){let v=parseInt(this.value);if(isNaN(v)||v<0)v=0;productItems[idx].quantity=v;updateTotal();const s=document.getElementById(`item-subtotal-${idx}`);if(s)s.innerText=`单品小计: ¥${computeSingleItemTotal(productItems[idx]).toFixed(2)}`;triggerCloudSync(false);});
document.querySelector(`.white-ink[data-whiteidx="${idx}"]`)?.addEventListener('change',function(){productItems[idx].whiteInk=this.checked;updateTotal();triggerCloudSync(false);});
document.querySelector(`.special-shape[data-shapeidx="${idx}"]`)?.addEventListener('change',function(){productItems[idx].specialShape=this.checked;updateTotal();triggerCloudSync(false);});
document.querySelector(`.cutout-fee[data-cutidx="${idx}"]`)?.addEventListener('input',function(){let v=parseFloat(this.value);if(isNaN(v))v=0;productItems[idx].cutoutFee=v;updateTotal();triggerCloudSync(false);});
document.querySelector(`[data-dyn-stand="${idx}"]`)?.addEventListener('change',function(){if(!productItems[idx].dynamicParams)productItems[idx].dynamicParams={};productItems[idx].dynamicParams.standType=this.value;updateTotal();triggerCloudSync(false);});
document.querySelector(`[data-dyn-face="${idx}"]`)?.addEventListener('input',function(){let v=parseInt(this.value)||0;if(!productItems[idx].dynamicParams)productItems[idx].dynamicParams={};productItems[idx].dynamicParams.extraFaceNum=v;updateTotal();triggerCloudSync(false);});
document.querySelector(`[data-dyn-longtotal="${idx}"]`)?.addEventListener('input',function(){let v=parseInt(this.value)||0;if(!productItems[idx].dynamicParams)productItems[idx].dynamicParams={};productItems[idx].dynamicParams.longTotalNum=v;updateTotal();triggerCloudSync(false);});
document.querySelector(`[data-dyn-layer="${idx}"]`)?.addEventListener('input',function(){let v=parseInt(this.value)||0;if(!productItems[idx].dynamicParams)productItems[idx].dynamicParams={};productItems[idx].dynamicParams.liumaExtraLayer=v;updateTotal();triggerCloudSync(false);});
document.querySelector(`[data-dyn-acrylic="${idx}"]`)?.addEventListener('input',function(){let v=parseFloat(this.value);if(isNaN(v))v=30;if(!productItems[idx].dynamicParams)productItems[idx].dynamicParams={};productItems[idx].dynamicParams.acrylicCustomPrice=v;updateTotal();triggerCloudSync(false);});
document.querySelector(`[data-dyn-custom="${idx}"]`)?.addEventListener('input',function(){let v=parseFloat(this.value);if(isNaN(v))v=20;if(!productItems[idx].dynamicParams)productItems[idx].dynamicParams={};productItems[idx].dynamicParams.customOtherPrice=v;updateTotal();triggerCloudSync(false);});

document.querySelector(`.custom-name-input[data-idx="${idx}"]`)?.addEventListener('input',function(){
    if(!productItems[idx].dynamicParams)productItems[idx].dynamicParams={};
    productItems[idx].dynamicParams.customName=this.value;
    renderReceiptPreview();
    triggerCloudSync(false);
});
document.querySelector(`.custom-price-input[data-idx="${idx}"]`)?.addEventListener('input',function(){
    let v=parseFloat(this.value);
    if(isNaN(v))v=0;
    if(!productItems[idx].dynamicParams)productItems[idx].dynamicParams={};
    productItems[idx].dynamicParams.customPrice=v;
    updateTotal();
    const s=document.getElementById(`item-subtotal-${idx}`);
    if(s)s.innerText=`单品小计: ¥${computeSingleItemTotal(productItems[idx]).toFixed(2)}`;
    triggerCloudSync(false);
});
document.querySelector(`.save-preset-btn[data-idx="${idx}"]`)?.addEventListener('click',function(){
    const name = productItems[idx].dynamicParams?.customName;
    const price = productItems[idx].dynamicParams?.customPrice || 20;
    if(!name || !name.trim()){ alert('请先填写备注名称'); return; }
    
    let catNames = productLibrary.categories.map(c=>c.name).join('、');
    let selectedCatName = prompt(`请选择添加到哪个分类（输入分类名称）：\n当前分类有：${catNames}`, '其他类');
    if(!selectedCatName) return;
    
    let cat = productLibrary.categories.find(c=>c.name===selectedCatName.trim());
    if(!cat){
        if(confirm(`分类"${selectedCatName}"不存在，是否新建该分类？`)){
            addCategory(selectedCatName.trim());
            cat = productLibrary.categories.find(c=>c.name===selectedCatName.trim());
        } else return;
    }
    
    const newId = 'type_' + generateId();
    cat.types.push({ id: newId, label: name.trim(), basePrice: price });
    saveLibrary(true);
    
    productItems[idx].typeId = newId;
    productItems[idx].categoryId = cat.id;
    productItems[idx].dynamicParams = {};
    renderAllProducts();
    updateTotal();
    triggerCloudSync(true);
    alert('预设添加成功！已自动切换为刚保存的预设。');
});
}

function refreshAllProductSelects(){renderAllProducts();updateTotal();}

/* 全局事件 */
document.getElementById('productsContainer')?.addEventListener('click',function(e){const b=e.target.closest('.delete-item');if(b&&b.dataset.delidx!==undefined){const i=parseInt(b.dataset.delidx);if(!isNaN(i))deleteProduct(i);}});
document.getElementById('addProductBtn')?.addEventListener('click',addProduct);
document.getElementById('clearAllBtn')?.addEventListener('click',clearAllProducts);
document.getElementById('refreshTotalBtn')?.addEventListener('click',()=>{updateTotal();triggerCloudSync(true);});
['licenseSelect','expressCheck','depositCheck','designModFee','extraHandFee','discountSelect','discountCustomValue','discountFixed','roundingSelect'].forEach(id=>{const el=document.getElementById(id);if(!el)return;const evt=(el.type==='checkbox'||el.tagName==='SELECT')?'change':'input';el.addEventListener(evt,()=>{updateTotal();triggerCloudSync(false);});});
document.getElementById('discountSelect')?.addEventListener('change',function(){document.getElementById('discountCustomGroup').classList.toggle('show',this.value==='custom');updateTotal();triggerCloudSync(false);});
document.getElementById('toggleLibraryBtn')?.addEventListener('click',()=>{document.getElementById('pricing-section').classList.add('show-library');renderLibrary();});
document.getElementById('backFromLibraryBtn')?.addEventListener('click',()=>{document.getElementById('pricing-section').classList.remove('show-library');refreshAllProductSelects();});

/* ============================================================
   3. 订单详情
============================================================ */
function generateOrderId(){const n=new Date();const y=n.getFullYear(),m=String(n.getMonth()+1).padStart(2,'0'),d=String(n.getDate()).padStart(2,'0');let c=parseInt(localStorage.getItem('orderCounter')||'0');c++;localStorage.setItem('orderCounter',String(c));triggerCloudSync(false);return `ORD-${y}-${m}-${d}-${String(c).padStart(3,'0')}`;}

function generateReceipt(){
const container=document.getElementById('receiptContainer');
let itemsHtml='',count=0,totalRaw=0;
for(let item of productItems){const q=item.quantity;if(!q)continue;count++;let l=getTypeLabel(item.typeId);if(item.typeId==='type_generic_custom')l=item.dynamicParams?.customName||'其他';const sub=computeSingleItemTotal(item);totalRaw+=sub;const dd=getDynamicDesc(item);const ex=[];if(item.whiteInk)ex.push('白墨');if(item.specialShape)ex.push('异形');if(item.cutoutFee>0)ex.push(`抠图+${item.cutoutFee}`);const desc=`${l}${dd?'('+dd+')':''}×${q}${ex.length?' ['+ex.join('·')+']':''}`;itemsHtml+=`<div class="receipt-item"><span class="left">${count}. ${desc}</span><span class="right">¥${sub.toFixed(2)}</span></div>`;}
if(!itemsHtml){alert('当前没有可生成订单详情的制品');return;}
const df=parseFloat(document.getElementById('designModFee')?.value)||0;
const eh=parseFloat(document.getElementById('extraHandFee')?.value)||0;
const dfix=parseFloat(document.getElementById('discountFixed')?.value)||0;
const lic=parseFloat(document.getElementById('licenseSelect')?.value)||1;
const ie=document.getElementById('expressCheck')?.checked||false;
const isDeposit=document.getElementById('depositCheck')?.checked||false;
const dd=getDiscountDisplay();
const tf=computeFinalTotal();
const now=new Date();
const ts=now.toLocaleString('zh-CN',{hour12:false});
const oid=generateOrderId();

let depositHtml = '';
if (isDeposit) {
    const dep = tf * 0.3;
    const bal = tf - dep;
    depositHtml = `<div class="receipt-divider"></div><div class="receipt-item" style="font-weight:600;color:#d9534f;"><span class="left">定金 (30%)</span><span class="right">¥${dep.toFixed(2)}</span></div><div class="receipt-item" style="font-weight:600;"><span class="left">尾款 (70%)</span><span class="right">¥${bal.toFixed(2)}</span></div>`;
}

container.innerHTML=`<div class="receipt-title">订单详情</div><div class="receipt-order-id">编号：${oid}</div><div class="receipt-time">${ts}</div>${itemsHtml}<div class="receipt-divider"></div><div class="receipt-item"><span class="left">小计</span><span class="right">¥${totalRaw.toFixed(2)}</span></div>${df>0?`<div class="receipt-item"><span class="left">设计修改费</span><span class="right">+¥${df.toFixed(2)}</span></div>`:''}${eh>0?`<div class="receipt-item"><span class="left">手工附加费</span><span class="right">+¥${eh.toFixed(2)}</span></div>`:''}<div class="receipt-item"><span class="left">授权倍率</span><span class="right">×${lic.toFixed(1)}</span></div><div class="receipt-item"><span class="left">折扣</span><span class="right">${dd}</span></div>${dfix>0?`<div class="receipt-item"><span class="left">立减金额</span><span class="right">-¥${dfix.toFixed(2)}</span></div>`:''}<div class="receipt-item"><span class="left">加急订单</span><span class="right">${ie?'是 (×1.5)':'否'}</span></div><div class="receipt-divider"></div><div class="receipt-total"><span>总计</span><span>¥${tf.toFixed(2)}</span></div>${depositHtml}<div class="receipt-footer" style="margin-top:16px;">感谢惠顾！</div>`;
syncStampToReceipt();
html2canvas(container,{scale:2,backgroundColor:'#ffffff',logging:false,useCORS:true}).then(canvas=>{const link=document.createElement('a');link.download=`订单详情_${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}.png`;link.href=canvas.toDataURL('image/png');link.click();}).catch(()=>alert('生成订单详情失败'));}

document.getElementById('generateReceiptBtn')?.addEventListener('click',generateReceipt);

/* ============================================================
   4. 小票图片
============================================================ */
let stampImageData=null,stampImageSize=60;
function applyStampImage(){const pc=document.getElementById('stampImagePreview');const eh=document.getElementById('stampEmptyHint');const d=document.getElementById('stampImageDisplay');const s=document.getElementById('stampSizeSlider');const l=document.getElementById('stampSizeLabel');if(stampImageData){d.src=stampImageData;d.style.width=stampImageSize+'%';s.value=stampImageSize;l.textContent=stampImageSize+'%';pc.style.display='block';eh.style.display='none';}else{pc.style.display='none';eh.style.display='block';}syncStampToReceipt();}
function syncStampToReceipt(){const c=document.getElementById('receiptContainer');if(!c)return;const old=c.querySelector('.stamp-image');if(old)old.remove();if(!stampImageData)return;const img=document.createElement('img');img.src=stampImageData;img.className='stamp-image';img.style.width=stampImageSize+'%';c.appendChild(img);}
document.getElementById('stampImageInput').addEventListener('change',function(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=ev=>{stampImageData=ev.target.result;stampImageSize=60;applyStampImage();triggerCloudSync(true);renderReceiptPreview();};r.readAsDataURL(f);this.value='';});
document.getElementById('stampSizeSlider').addEventListener('input',function(){stampImageSize=parseInt(this.value);document.getElementById('stampSizeLabel').textContent=stampImageSize+'%';const d=document.getElementById('stampImageDisplay');if(d)d.style.width=stampImageSize+'%';syncStampToReceipt();triggerCloudSync(false);});
document.getElementById('stampRemoveBtn').addEventListener('click',()=>{stampImageData=null;stampImageSize=60;applyStampImage();triggerCloudSync(true);renderReceiptPreview();});

/* ============================================================
   5. 数据导入导出
============================================================ */
function exportAllData(){
    const state = {
        productLibrary: productLibrary,
        productItems: productItems,
        nextId: nextId,
        orderCounter: localStorage.getItem('orderCounter') || '0',
        stampPreset: { image: stampImageData, size: stampImageSize },
        settings: {
            license: document.getElementById('licenseSelect').value,
            express: document.getElementById('expressCheck').checked,
            deposit: document.getElementById('depositCheck').checked,
            designModFee: document.getElementById('designModFee').value,
            extraHandFee: document.getElementById('extraHandFee').value,
            discountSelect: document.getElementById('discountSelect').value,
            discountCustomValue: document.getElementById('discountCustomValue').value,
            discountFixed: document.getElementById('discountFixed').value,
            rounding: document.getElementById('roundingSelect').value
        }
    };
    const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');a.href=url;a.download=`数据备份_${new Date().toISOString().slice(0,10)}.json`;a.click();URL.revokeObjectURL(url);
    localStorage.setItem('lastExportDate',new Date().toISOString());
}
function importAllData(file){
    const r=new FileReader();
    r.onload=function(e){
        try{
            const data=JSON.parse(e.target.result);
            if(!data.productLibrary && !data.productItems){alert('无效的数据文件');return;}
            if(!confirm('导入将覆盖当前所有数据（且同步到云端），确认继续？'))return;
            
            applyCloudState(data);
            triggerCloudSync(true);
            alert('数据导入成功！');
        }catch(err){alert('导入失败：'+err.message);}
    };
    r.readAsText(file);
}
document.getElementById('exportDataBtn').addEventListener('click',exportAllData);
document.getElementById('importDataBtn').addEventListener('click',()=>document.getElementById('importFileInput').click());
document.getElementById('importFileInput').addEventListener('change',function(e){if(this.files.length){importAllData(this.files[0]);this.value='';}});
document.getElementById('backupReminderExport').addEventListener('click',function(){document.getElementById('backupReminderModal').classList.remove('show');exportAllData();});
document.getElementById('backupReminderDismiss').addEventListener('click',function(){document.getElementById('backupReminderModal').classList.remove('show');localStorage.setItem('lastExportDate',new Date().toISOString());});
function checkBackupReminder(){const le=localStorage.getItem('lastExportDate');if(!le){setTimeout(()=>document.getElementById('backupReminderModal').classList.add('show'),1200);return;}const days=(new Date()-new Date(le))/(1000*60*60*24);if(days>7)setTimeout(()=>document.getElementById('backupReminderModal').classList.add('show'),1200);}

/* ============================================================
   6. 深色模式
============================================================ */
function toggleTheme(){document.body.classList.toggle('dark');localStorage.setItem('theme',document.body.classList.contains('dark')?'dark':'light');}
function loadTheme(){const t=localStorage.getItem('theme');if(t==='dark')document.body.classList.add('dark');else document.body.classList.remove('dark');}
document.getElementById('themeToggle').addEventListener('click',toggleTheme);

/* ============================================================
   7. 初始化
============================================================ */
async function init(){
    loadTheme();
    
    // 先用本地或默认数据把界面画出来
    const localRaw = localStorage.getItem('app_state_backup');
    if (localRaw) {
        try { applyCloudState(JSON.parse(localRaw)); } catch(e) { loadLibrary(); }
    } else {
        loadLibrary();
    }
    
    // 然后去云端拉取最新数据（如果成功会覆盖并重新渲染）
    await loadFromCloud();
    
    const ds=document.getElementById('discountSelect');
    if(ds.value==='custom') document.getElementById('discountCustomGroup').classList.add('show');
    
    renderReceiptPreview();
    checkBackupReminder();
}
init();
</script>
